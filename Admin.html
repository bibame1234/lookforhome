<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – LookForHome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#0B3D6E',secondary:'#1565C0',accent:'#1E90FF',light:'#B3E0FF',bg:'#F0F7FF'}}}}</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-bg min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-lg border border-light/50 p-8 w-full max-w-md">
    <p class="brand-text text-center mb-6 block">LOOKFORHOME</p>
    <h1 class="text-xl font-bold text-primary text-center mb-6">Accès administration</h1>
    <form id="adminLoginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" id="email" required class="w-full border rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-accent">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Mot de passe</label>
        <input type="password" id="password" required class="w-full border rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-accent">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Code admin</label>
        <input type="text" id="adminCode" required class="w-full border rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-accent" placeholder="Code secret">
      </div>
      <p id="err" class="text-sm text-red-600 hidden"></p>
      <button type="submit" class="w-full py-3 rounded-xl bg-accent text-white font-semibold">Connexion</button>
    </form>
  </div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.classList.add('hidden');
      try {
        const data = await AuthAPI.login({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          role: 'ADMIN',
          adminCode: document.getElementById('adminCode').value.trim(),
        });
        if (data.user && data.user.role !== 'ADMIN') throw new Error('Accès refusé');
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        location.href = 'admin-dashboard.html';
      } catch (ex) {
        err.textContent = ex.message || 'Échec connexion';
        err.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
