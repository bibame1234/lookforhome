<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription – LookForHome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#0B3D6E',secondary:'#1565C0',accent:'#1E90FF',light:'#B3E0FF',bg:'#F0F7FF'}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-bg min-h-screen">
  <header class="bg-white border-b border-light/60">
    <div class="max-w-lg mx-auto px-4 h-16 flex items-center">
      <a href="index.html"><span class="brand-text">LOOKFORHOME</span></a>
    </div>
  </header>
  <main class="max-w-lg mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-primary mb-6">Créer un compte</h1>
    <form id="registerForm" class="bg-white rounded-2xl shadow-sm border border-light/50 p-6 space-y-5">
      <div class="flex gap-2 p-1 bg-bg rounded-xl">
        <button type="button" data-role="tenant" class="role-tab flex-1 py-2.5 text-sm font-medium rounded-lg bg-accent text-white">Locataire</button>
        <button type="button" data-role="landlord" class="role-tab flex-1 py-2.5 text-sm font-medium rounded-lg text-secondary">Bailleur</button>
        <button type="button" data-role="driver" class="role-tab flex-1 py-2.5 text-sm font-medium rounded-lg text-secondary">Chauffeur</button>
      </div>
      <input type="hidden" id="role" value="tenant">
      <div>
        <label class="block text-sm font-medium text-primary mb-1">Nom complet</label>
        <input type="text" required class="w-full border border-light rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-accent outline-none" placeholder="Votre nom">
      </div>
      <div>
        <label class="block text-sm font-medium text-primary mb-1">Email</label>
        <input type="email" required class="w-full border border-light rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-accent outline-none" placeholder="email@exemple.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-primary mb-1">Sexe</label>
        <select id="gender" required class="w-full border border-light rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-accent outline-none">
          <option value="homme">Homme</option>
          <option value="femme">Femme</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-primary mb-1">WhatsApp (9 chiffres)</label>
        <div class="flex gap-2">
          <span class="inline-flex items-center px-3 bg-bg border border-light rounded-xl text-secondary text-sm">+237</span>
          <input type="tel" id="whatsapp" required inputmode="numeric" maxlength="9" pattern="[0-9]{9}"
            class="flex-1 border border-light rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-accent outline-none"
            placeholder="6XXXXXXXX">
        </div>
        <p class="text-xs text-secondary mt-1">Exactement 9 chiffres, sans indicatif</p>
      </div>
      <div id="passwordField">
        <label class="block text-sm font-medium text-primary mb-1">Mot de passe</label>
        <input type="password" id="password" required maxlength="6"
          class="w-full border border-light rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-accent outline-none"
          placeholder="4 chiffres + 2 lettres">
        <p class="text-xs text-secondary mt-1">Exactement 4 chiffres et 2 lettres (6 caractères)</p>
      </div>
      <p id="formError" class="text-sm text-red-600 hidden"></p>
      <button type="submit" class="w-full py-3.5 rounded-xl font-semibold text-white bg-accent hover:bg-secondary">S'inscrire</button>
      <p class="text-center text-sm text-secondary">Déjà un compte ? <a href="login.html" class="text-accent font-medium">Connexion</a></p>
    </form>
  </main>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
