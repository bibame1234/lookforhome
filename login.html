<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion – LookForHome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0A1931',
            secondary: '#1A3D63',
            accent: '#4A7FA7',
            light: '#B3CFE5',
            bg: '#F6FAFD',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">

  </head>
<body class="bg-bg min-h-screen flex flex-col">

  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html"><img src="../assets/logo-lookforhome.jpg" alt="LookForHome" class="h-10"></a>
      <a href="register.html" class="text-sm font-medium text-accent hover:underline">Créer un compte</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-lg border border-light/50 p-8">
        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-primary mb-2">Connexion</h1>
          <p class="text-secondary text-sm">Accédez à votre espace LookForHome</p>
        </div>

        <!-- Role tabs -->
        <div class="flex rounded-xl bg-bg p-1 mb-6">
          <button type="button" data-role="tenant" class="role-tab flex-1 py-2.5 text-sm font-medium rounded-lg bg-accent text-white transition">Locataire</button>
          <button type="button" data-role="landlord" class="role-tab flex-1 py-2.5 text-sm font-medium rounded-lg text-secondary transition">Bailleur</button>
          <button type="button" data-role="admin" class="role-tab flex-1 py-2.5 text-sm font-medium rounded-lg text-secondary transition">Admin</button>
        </div>

        <form id="loginForm" class="space-y-5">
          <input type="hidden" id="role" value="tenant">

          <div>
            <label class="block text-sm font-medium text-primary mb-1.5">Adresse email</label>
            <input type="email" required placeholder="exemple@email.com"
              class="w-full px-4 py-3 rounded-xl border border-light focus:border-accent focus:ring-2 focus:ring-accent/20 outline-none transition">
          </div>

          <div>
            <label class="block text-sm font-medium text-primary mb-1.5">Mot de passe</label>
            <input type="password" required placeholder="••••••••"
              class="w-full px-4 py-3 rounded-xl border border-light focus:border-accent focus:ring-2 focus:ring-accent/20 outline-none transition">
          </div>

          <div id="adminCodeField" class="hidden">
            <label class="block text-sm font-medium text-primary mb-1.5">Code administrateur</label>
            <input type="text" placeholder="Code secret admin"
              class="w-full px-4 py-3 rounded-xl border border-light focus:border-accent focus:ring-2 focus:ring-accent/20 outline-none transition">
          </div>

          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="rounded border-light text-accent focus:ring-accent">
              <span class="text-secondary">Se souvenir de moi</span>
            </label>
            <a href="#" class="text-accent hover:underline">Mot de passe oublié ?</a>
          </div>

          <button type="submit"
            class="w-full py-3.5 rounded-xl font-semibold text-white bg-accent hover:bg-secondary transition shadow-md">
            Se connecter
          </button>
        </form>

        <p class="mt-6 text-center text-sm text-secondary">
          Pas encore de compte ?
          <a href="register.html" class="text-accent font-medium hover:underline">S’inscrire</a>
        </p>
      </div>

      <p class="mt-6 text-center text-xs text-secondary">
        En vous connectant, vous acceptez notre
        <a href="privacy.html" class="underline">politique de confidentialité</a>.
      </p>
    </div>
  </main>
    <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
